name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: smoke test the CLI
        run: |
          mingtu --version
          mingtu full --solar 1995-3-12 --time 14:20 --gender 女 --city 杭州 --outdir /tmp/out --today
          test -s /tmp/out/chart.json
          test -s /tmp/out/lifeline.json
