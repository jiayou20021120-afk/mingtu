[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mingtu"
version = "0.1.0"
description = "命途 — 八字与紫微斗数双轴人生全流程推演 / Chinese destiny analysis across a whole life arc, Bazi and Ziwei Doushu cross-checked year by year"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "mingtu contributors" }]
keywords = ["bazi", "ziwei", "chinese-astrology", "八字", "紫微斗数", "命理", "fortune"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3",
  "Topic :: Other/Nonlisted Topic",
]
dependencies = ["lunar-python>=1.4.0", "iztro-py>=0.5.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jiayou20021120-afk/mingtu"
Issues = "https://github.com/jiayou20021120-afk/mingtu/issues"

[project.scripts]
mingtu = "mingtu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
